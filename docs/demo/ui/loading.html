<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tessera Studio</title>
<link rel="icon" href="tessera-icon.png">
<style>
  /* Shown the moment the Tessera shortcut is clicked, while the studio starts behind it (forge/launcher.py). */
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { background: #08080b; color: #a3a3b2; font: 12px/1.5 "JetBrains Mono", ui-monospace, Menlo, monospace;
         display: grid; place-items: center; }
  main { display: grid; justify-items: center; gap: 18px; }
  img { width: 84px; height: auto; filter: drop-shadow(0 8px 24px rgba(157, 92, 255, .4)); }
  p { margin: 0; letter-spacing: .22em; text-transform: uppercase; }
  p.err { letter-spacing: 0; text-transform: none; color: #fca5a5; max-width: 420px; text-align: center; }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  @media (prefers-reduced-motion: reduce) { .dots::after { animation: none; } }
</style>
</head>
<body>
<main>
  <img src="tessera-mark-live.svg" alt="">
  <p id="say" class="dots">Starting Tessera Studio</p>
</main>
<script>
  // The studio's address comes in the hash: loading.html#http://127.0.0.1:8420/?project=Tarky
  const target = decodeURIComponent(location.hash.slice(1)) || "http://127.0.0.1:8420/";
  const health = new URL("/api/health", target).href;
  const started = Date.now();
  async function poll() {
    try {
      await fetch(health, { mode: "no-cors", cache: "no-store" }); // any answer means the server is up
      location.replace(target);
      return;
    } catch { /* not up yet */ }
    if (Date.now() - started > 45000) {
      const say = document.getElementById("say");
      say.className = "err";
      say.textContent = "Tessera didn't start. Close this window and click the Tessera shortcut again. If it keeps happening, the log is in .forge/logs/tessera-server.log in your home folder.";
      return;
    }
    setTimeout(poll, 250);
  }
  poll();
</script>
</body>
</html>
