<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tessera Studio</title>
  <link rel="icon" href="/ui/tessera-mark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/ui/styles.css" />
  <link rel="stylesheet" href="/ui/editor.css" />
  <link rel="stylesheet" href="/ui/pipeline.css" />
  <link rel="stylesheet" href="/ui/motion.css" />
  <link rel="stylesheet" href="/ui/flows.css" />
  <link rel="stylesheet" href="/ui/theater.css" />
  <link rel="stylesheet" href="/ui/drops.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }
  </script>
</head>
<body>
  <!-- Top bar: where you are, and the app-wide controls -->
  <header class="topbar" id="topbar">
    <button class="app-brand" type="button" id="brandBtn" title="All projects" aria-label="All projects"><img class="app-mark" src="/ui/tessera-mark.svg" alt=""></button>
    <div class="project-picker">
      <button id="projectsBtn" class="project-btn" type="button" title="Switch project"><span id="projectName">Project</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
      <button id="newProjectBtn" class="icon-btn ghosted" type="button" title="New project" aria-label="New project"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <span class="tb-sep" aria-hidden="true"></span>
    <button id="backBtn" class="icon-btn ghosted back-btn" type="button" title="Back (Alt ←)" aria-label="Back" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
    <div class="head-actions">
      <button id="paletteBtn" class="palette-btn" type="button" title="Search assets, pages and actions (⌘K)" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><span>Search</span><kbd>⌘K</kbd></button>
      <button id="galleryBtn" class="icon-btn ghosted" type="button" title="Gallery mode: art only (G)" aria-label="Gallery mode"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="m3.5 16 5-5 4 4 3-3 5 5"/><circle cx="15.5" cy="9" r="1.5"/></svg></button>
      <span class="tb-sep" aria-hidden="true"></span>
      <button class="icon-btn ghosted region-btn" type="button" data-toggle-region="tree" title="Project tree ([)" aria-label="Project tree"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg></button>
      <span class="tb-sep" aria-hidden="true"></span>
      <button id="settingsBtn" class="icon-btn ghosted" type="button" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M12 2.5v3M12 18.5v3M4.2 6.5l2.6 1.5M17.2 16l2.6 1.5M2.5 12h3M18.5 12h3M4.2 17.5 6.8 16M17.2 8l2.6-1.5" /></svg></button>
    </div>
  </header>

  <div class="workbench">
    <!-- The editor: project tree | page -->
    <div class="shell" id="studio">
      <aside class="sections" id="sections" aria-label="Project tree"></aside>
      <div class="split split-v" data-resizer="tree" role="separator" aria-orientation="vertical" title="Drag to resize · double-click to reset"></div>
      <main class="content" id="content"></main>
    </div>

    <!-- Tess: floats, docks to the right, or closes to the launcher pill -->
    <section class="panel chat" id="chatWin" role="dialog" aria-labelledby="chatTitle">
      <header class="chat-head">
        <img class="chat-face" src="/ui/tess-avatar.png" alt="">
        <div class="chat-title"><strong id="chatTitle">Tess</strong><small id="chatSub">Art director</small></div>
        <button id="chatDockBtn" class="icon-btn ghosted small" type="button" title="Float the chat" aria-label="Float the chat"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M14.5 4.5v15"/></svg></button>
        <button id="chatCloseBtn" class="icon-btn ghosted small" type="button" title="Close (Esc)" aria-label="Close the chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      </header>

      <div class="tabs" id="sessionTabs" role="tablist" aria-label="Chats"></div>

      <div class="messages" id="messages" aria-live="polite"></div>

      <form class="composer" id="composer">
        <div class="composer-card">
          <div class="attachments" id="attachments"></div>
          <textarea id="input" rows="1" placeholder="Ask Tess to plan, make or change anything…"></textarea>
          <div class="composer-row">
            <label class="tool-btn" title="Attach image" aria-label="Attach image">
              <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20 11-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7" /></svg>
            </label>
            <div class="model-pill-wrap">
              <button type="button" class="model-pill" id="modelPill" aria-haspopup="listbox"><span class="dot" id="statusDot"></span><span id="modelPillLabel">Connecting…</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
              <div class="model-pop" id="modelPop" hidden></div>
            </div>
            <span class="grow"></span>
            <button id="sendBtn" class="send-btn" type="submit" title="Send (Enter)" aria-label="Send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
          </div>
        </div>
        <div class="composer-hint" id="contextMeter">Enter to send · Shift+Enter for a new line</div>
      </form>
      <span class="rz rz-n" data-resize="n"></span><span class="rz rz-s" data-resize="s"></span><span class="rz rz-e" data-resize="e"></span><span class="rz rz-w" data-resize="w"></span>
      <span class="rz rz-nw" data-resize="nw"></span><span class="rz rz-ne" data-resize="ne"></span><span class="rz rz-sw" data-resize="sw"></span><span class="rz rz-se" data-resize="se"></span>
    </section>
  </div>

  <footer class="statusbar" id="statusBar" aria-label="Status"></footer>

  <button id="chatLauncher" class="chat-launcher" type="button" title="Ask Tess (/)" hidden><img src="/ui/tess-avatar.png" alt=""><span>Ask Tess</span><kbd>/</kbd><span class="count" aria-label="unread replies"></span></button>

  <!-- All projects -->
  <section class="projects-view" id="projectsView" hidden aria-label="Projects">
    <header class="pv-top">
      <div class="app-brand static"><img class="app-mark" src="/ui/tessera-mark.svg" alt=""><span class="app-word">Tessera<small>Studio</small></span></div>
      <button class="icon-btn" type="button" id="closeProjectsBtn" title="Back to project" aria-label="Back to project">✕</button>
    </header>
    <div class="pv-main">
      <div class="pv-head">
        <h1>Projects</h1>
        <div class="pv-tools">
          <button class="ghost" type="button" data-st-move title="Choose the folder that holds your projects">Choose folder</button>
          <input id="projectSearch" type="search" placeholder="Search…" aria-label="Search projects">
          <select id="projectSort" aria-label="Sort"><option value="updated">Last modified</option><option value="name">Name</option></select>
          <button class="ghost" type="button" data-st-import-zip title="Import a workspace .zip exported from Tessera (Export workspace on a project card)">Import workspace</button>
          <button class="ghost" type="button" data-imp-open title="Import a Godot, Unity or Unreal project">Import game</button>
          <button class="primary" type="button" data-new-project>New project</button>
        </div>
      </div>
      <div class="pv-grid" id="projectGrid"></div>
      <p class="pv-foot" id="projectsFoot"></p>
    </div>
  </section>

  <!-- Settings -->
  <section class="settings-view" id="settingsView" hidden aria-label="Settings"></section>

  <!-- New project onboarding -->
  <section class="onboard" id="onboarding" hidden aria-label="New project">
    <button class="ob-skip ob-cancel" type="button" data-ob-cancel>Cancel</button>
    <button class="ob-skip" type="button" data-ob-skip>Skip · start blank</button>
    <div class="ob-stage" id="obStage"></div>
  </section>

  <!-- Importing a game project -->
  <section class="onboard import-view" id="importView" hidden aria-label="Import a game">
    <button class="ob-skip" type="button" data-imp-close>Close</button>
    <div class="ob-stage wide" id="importStage"></div>
  </section>

  <!-- First-run setup -->
  <section class="onboard setup" id="setup" hidden aria-label="Set up Tessera Studio">
    <button class="ob-skip" type="button" data-setup-skip>Skip setup</button>
    <div class="ob-stage" id="setupStage"></div>
  </section>

  <div class="update-banner" id="updateBanner" role="status" hidden></div>
  <dialog id="dialog"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="/ui/app.js"></script>
</body>
</html>
