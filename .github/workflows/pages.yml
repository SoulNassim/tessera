# Publishes the website (landing page, demo, installers' scripts) to GitHub Pages.
# Only the website goes out: docs/ also holds README art and files the site does not need.
name: Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the public pages
        run: |
          mkdir site
          for item in index.html 404.html install.ps1 install.sh agent.md demo landing oauth screenshots; do cp -R "docs/$item" site/; done
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
