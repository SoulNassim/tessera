# Builds the desktop installers and the Python wheel, then publishes them as a GitHub release of this repo
# (SoulNassim/tessera). Push a tag like v0.1.0 and the download links (releases/latest/download/...) pick the files up.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: TesseraStudio-Setup-Windows.exe
          - os: macos-latest
            asset: TesseraStudio-macOS.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Version
        id: v
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] && echo "version=$ref" >> "$GITHUB_OUTPUT" || echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"

      # The built app reports this version to its updater.
      - name: Stamp version
        if: github.ref_type == 'tag'
        shell: bash
        run: sed -i.bak -E "s/^__version__ = .*/__version__ = \"${{ steps.v.outputs.version }}\"/" forge/__init__.py && rm forge/__init__.py.bak

      - name: Build app with PyInstaller
        run: uv run --with pyinstaller python scripts/build_desktop.py

      # Inno Setup builds the install engine; build_setup.py wraps it in Tessera's own setup window.
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" "/DAppVersion=${{ steps.v.outputs.version }}" packaging\windows\tessera.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run python packaging/windows/setup/build_setup.py --version "${{ steps.v.outputs.version }}"

      - name: macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg && cp -R dist/TesseraStudio.app "dmg/Tessera Studio.app" && ln -s /Applications dmg/Applications
          hdiutil create -volname "Tessera Studio" -srcfolder dmg -ov -format UDZO dist/TesseraStudio-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # For `uv tool install` (Linux, or anyone who prefers a terminal) and for the updater of such installs.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Stamp version
        if: github.ref_type == 'tag'
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^__version__ = .*/__version__ = \"$v\"/" forge/__init__.py
          sed -i -E "s/^version = .*/version = \"$v\"/" pyproject.toml
      - run: uv build --wheel --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  release:
    needs: [build, wheel]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tessera Studio ${{ github.ref_name }}
          files: out/*
