[project]
name = "tessera-studio"
version = "1.1.0"
description = "Tessera Studio: a local, agent-friendly game art studio (2D art, pixel sprites, 3D models, rigs, animations and sound)"
readme = "README.md"
license = "LicenseRef-PolyForm-Shield-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "pillow>=10.4.0",
    "python-multipart>=0.0.12",
    "anthropic>=2.0",
    "pystray>=0.19.5; sys_platform == 'win32'",
    # Tessera's native window (forge/native_window.py); Linux uses a Chromium app window instead.
    "pywebview>=6.2,<7; sys_platform == 'win32' or sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
tessera = "forge.cli:main"
# Older names from before the rename to Tessera Studio; they keep working.
glob = "forge.cli:main"
forge = "forge.cli:main"
forge-mcp = "forge.mcp.server:main"

[project.gui-scripts]
tessera-app = "forge.desktop:main"
glob-app = "forge.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
